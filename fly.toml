# fly.toml app configuration file generated for beaconcha-in on 2026-11-09T23:20:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'beaconcha-in'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
